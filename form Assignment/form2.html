<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" 
    crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #4169f5;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

.form-box {
    width: 100%;
    max-width: 650px;
    background-color: white;
    padding: 25px;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

h2 {
    font-size: 22px;
    color: #333;
    margin-bottom: 25px;
    position: relative;
}

h2::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -5px;
    width: 22px;
    height: 3px;
    background-color: #4169f5;
}

h3 {
    font-size: 14px;
    color: #777;
    font-weight: 500;
    margin-bottom: 18px;
}

.details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px 18px;
    margin-bottom: 20px;
}

.input-box {
    display: flex;
    flex-direction: column;
}

.input-box label {
    font-size: 12px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
}

.input-box input {
    width: 100%;
    height: 35px;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    outline: none;
    font-size: 12px;
}

.input-box input:focus {
    border-color: #4169f5;
}

button {
    width: 30%;
    height: 35px;
    background-color: #4169f5;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}



    </style>
</head>

<body>

    <div class="container">

        <div class="form-box">

            <h2>Registration</h2>

            <form>

                <h3>Personal Details</h3>

                <div class="details">

                    <div class="input-box">
                        <label>Full Name</label>
                        <input type="text" placeholder="Enter your name">
                    </div>

                    <div class="input-box">
                        <label>Date of Birth</label>
                        <input type="text" placeholder="Enter birth date">
                    </div>

                    <div class="input-box">
                        <label>Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>

                    <div class="input-box">
                        <label>Mobile number</label>
                        <input type="tel" placeholder="Enter mobile number">
                    </div>

                    <div class="input-box">
                        <label>Gender</label>
                        <input type="text" placeholder="Enter your gender">
                    </div>

                    <div class="input-box">
                        <label>Occupation</label>
                        <input type="text" placeholder="Enter occupation">
                    </div>

                </div>

                <h3>Identity Details</h3>

                <div class="details">

                    <div class="input-box">
                        <label>ID Type</label>
                        <input type="text" placeholder="Enter ID type">
                    </div>

                    <div class="input-box">
                        <label>ID Number</label>
                        <input type="text" placeholder="Enter ID number">
                    </div>

                    <div class="input-box">
                        <label>Issue Authority</label>
                        <input type="text" placeholder="Enter issue department">
                    </div>

                    <div class="input-box">
                        <label>Issue Date</label>
                        <input type="text" placeholder="Enter ID issue date">
                    </div>

                    <div class="input-box">
                        <label>Issue State</label>
                        <input type="text" placeholder="Enter ID issue state">
                    </div>

                    <div class="input-box">
                        <label>Expiry Date</label>
                        <input type="text" placeholder="Enter ID expiry date">
                    </div>

                </div>

                <button type="submit">Next <i class="fa-solid fa-arrow-right-long"></i></button>

            </form>

        </div>

    </div>

</body>

</html>
